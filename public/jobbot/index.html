<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="A 2034 job-allocation terminal. The COMM 118 worksheet: your skills, three to five jobs in sports, and the one you are assigned.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* The base the artifact viewer gave the mockup, written out here. */
  * { box-sizing: border-box; }
  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  [hidden] { display: none !important; }
</style>
<title>JobBot 5000</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one white HUD panel, centred, 860px wide at most. A status strip
   with a live 2034 clock on top, a scrolling log framed by corner brackets,
   the operator's input dock pinned to the bottom. One light look, on
   purpose: the brief is a white screen that glows, so there is no night half. */
:root {
  --paper: #f7f9fd;
  --panel: #ffffff;
  --grid: rgba(37, 99, 235, 0.06);
  --ink: #0a1024;
  --dim: #5c6680;
  --rule: #d6ddec;
  --bot: #1d4ed8;
  --cyan: #0891b2;
  --glow: rgba(29, 78, 216, 0.28);
  --bot-soft: #eaf0ff;
  --ok: #047857;
  --warn: #b45309;
  --mono: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --display: 'Orbitron', 'Share Tech Mono', ui-monospace, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(29, 78, 216, 0.10), transparent 55%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.term {
  max-width: 860px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-inline: 16px;
  padding-block: 14px 0;
}

/* Status strip */
.bar {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 10px 16px;
  border: 1px solid var(--rule);
  border-bottom: 0;
  background: var(--panel);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  box-shadow: 0 1px 0 var(--rule);
}
.bar .name { font-family: var(--display); font-weight: 900; font-size: 15px; letter-spacing: 0.22em; color: var(--ink); }
.bar .name small { font-weight: 500; color: var(--cyan); font-size: 10px; margin-left: 10px; letter-spacing: 0.2em; }
.bar .light { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); flex: none; }
.bar .light.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(4,120,87,0.16), 0 0 10px rgba(4,120,87,0.5); }
.bar .light.think { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 0.8s ease-in-out infinite; }
.bar .spacer { flex: 1; }
.bar .clock, .bar .count { font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .clock b { color: var(--bot); font-weight: 400; }
.bar button {
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  background: none; border: 1px solid var(--rule); color: var(--dim);
  padding: 5px 10px; border-radius: 2px; cursor: pointer; min-height: 30px;
}
.bar button:hover { border-color: var(--bot); color: var(--bot); }
.bar button:focus-visible, .dock textarea:focus-visible, .choice button:focus-visible, .power:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* The progress rail under the strip: one segment per job. */
.rail { display: flex; gap: 4px; padding: 0 16px 10px; background: var(--panel); border-inline: 1px solid var(--rule); }
.rail i { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; transition: background 0.4s; }
.rail i.done { background: var(--bot); box-shadow: 0 0 6px var(--glow); }
.rail i.live { background: var(--cyan); animation: pulse-bar 1.2s ease-in-out infinite; }

/* The screen, with corner brackets and a slow scan sweep. */
.screen {
  flex: 1;
  position: relative;
  border: 1px solid var(--rule);
  border-top: 0;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.screen::before, .screen::after, .log::before, .log::after {
  content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid var(--bot); pointer-events: none; z-index: 2;
}
.screen::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
.screen::after { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
.log::before { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
.log::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
.scan {
  position: absolute; left: 0; right: 0; top: -20%; height: 18%;
  background: linear-gradient(180deg, transparent, rgba(8, 145, 178, 0.07) 60%, rgba(8, 145, 178, 0.14));
  pointer-events: none; animation: scan 7s linear infinite;
}
.log {
  position: relative;
  flex: 1;
  padding: 30px 28px 26px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-wrap: anywhere;
  min-width: 0;
}
.line { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; }
.line .tag { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); padding-top: 5px; white-space: nowrap; }
.line.bot .tag { color: var(--bot); }
.line.bot .tag::before { content: '\25B8\00a0'; color: var(--cyan); }
.line .txt { white-space: pre-wrap; min-width: 0; }
.line.bot .txt { color: var(--ink); text-shadow: 0 0 12px rgba(29, 78, 216, 0.12); }
.line.bot .txt .raw { color: var(--cyan); opacity: 0.6; }
.line.you .txt { color: var(--ink); background: var(--bot-soft); border-left: 2px solid var(--cyan); padding: 6px 12px; }
.line.sys .txt { color: var(--dim); font-size: 14px; }
.line.sys .ok { color: var(--ok); }
.line.sys .ok::before { content: '[ '; } .line.sys .ok::after { content: ' ]'; }
.line.warn .txt { color: var(--warn); }
.line.think .txt { color: var(--cyan); display: flex; flex-direction: column; gap: 6px; }
.line.think .proc { display: flex; gap: 3px; max-width: 260px; }
.line.think .proc i { flex: 1; height: 8px; background: var(--rule); animation: fill 1.1s linear infinite; }
.line.think .proc i:nth-child(1) { animation-delay: 0s; } .line.think .proc i:nth-child(2) { animation-delay: .1s; }
.line.think .proc i:nth-child(3) { animation-delay: .2s; } .line.think .proc i:nth-child(4) { animation-delay: .3s; }
.line.think .proc i:nth-child(5) { animation-delay: .4s; } .line.think .proc i:nth-child(6) { animation-delay: .5s; }
.line.think .proc i:nth-child(7) { animation-delay: .6s; } .line.think .proc i:nth-child(8) { animation-delay: .7s; }
.line.think .proc i:nth-child(9) { animation-delay: .8s; } .line.think .proc i:nth-child(10) { animation-delay: .9s; }
.cursor { display: inline-block; width: 0.55em; height: 1.05em; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); vertical-align: -0.18em; margin-left: 3px; animation: blink 0.9s steps(2, start) infinite; }

/* The allocation card */
.ticket {
  position: relative;
  margin-top: 6px;
  padding: 20px 22px;
  background: var(--panel);
  border: 1px solid var(--rule);
  box-shadow: 0 0 0 1px var(--panel), 0 0 40px var(--glow);
}
.ticket::before { content: ''; position: absolute; inset: 0; padding: 2px; background: linear-gradient(120deg, var(--bot), var(--cyan), var(--bot)); background-size: 200% 100%; animation: border-run 4s linear infinite; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.ticket h2 { margin: 0; font-family: var(--display); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cyan); font-weight: 700; }
.ticket .id { font-size: 11px; color: var(--dim); letter-spacing: 0.12em; margin-top: 2px; }
.ticket .big { font-family: var(--display); font-size: clamp(20px, 4.6vw, 30px); font-weight: 700; line-height: 1.2; margin: 12px 0 18px; text-wrap: balance; letter-spacing: 0.02em; }
.ticket .big b { color: var(--bot); font-weight: 900; }
.ticket dl { margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; font-size: 14px; }
.ticket dt { color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; padding-top: 3px; }
.ticket dd { margin: 0; white-space: pre-wrap; }
.ticket .job { border-top: 1px dashed var(--rule); margin-top: 14px; padding-top: 14px; }
.ticket .job h3 { margin: 0 0 8px; font-size: 15px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; }
.ticket .job h3 .pick { color: #fff; background: var(--bot); font-size: 10px; letter-spacing: 0.18em; padding: 2px 8px; margin-left: 10px; vertical-align: 2px; }
.ticket .bars { display: flex; gap: 2px; height: 22px; margin-top: 18px; opacity: 0.8; }
.ticket .bars i { background: var(--ink); width: 2px; }
.ticket .bars i.w { width: 4px; } .ticket .bars i.g { background: transparent; width: 3px; }

/* The record from the Index, and the operator's image */
.record { border: 1px solid var(--rule); border-left: 3px solid var(--cyan); padding: 12px 16px; background: var(--paper); max-width: 560px; }
.record h2 { margin: 0 0 8px; font-family: var(--display); font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--cyan); font-weight: 700; }
.record dl { margin: 0; display: grid; grid-template-columns: 150px 1fr; gap: 4px 14px; font-size: 14px; }
.record dt { color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; padding-top: 2px; }
.record dd { margin: 0; font-variant-numeric: tabular-nums; }
pre.portrait { margin: 0; font: 11px/1.05 var(--mono); color: var(--bot); letter-spacing: 0.02em; white-space: pre; overflow-x: auto; max-width: 100%; text-shadow: 0 0 10px var(--glow); }
.choice .file { font: inherit; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; background: var(--panel); color: var(--bot); border: 1px solid var(--bot); border-radius: 2px; padding: 6px 18px; letter-spacing: 0.16em; text-transform: uppercase; font-size: 13px; box-shadow: inset 0 0 0 0 var(--bot); transition: box-shadow 0.2s, color 0.2s; position: relative; }
.choice .file:hover { color: #fff; box-shadow: inset 0 -44px 0 0 var(--bot); }
.choice .file span { color: var(--dim); letter-spacing: 0.06em; text-transform: none; margin-left: 4px; }
.choice .file:hover span { color: #fff; }
.choice .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.choice .file:focus-within { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* The operator's dock */
.dock {
  position: sticky;
  bottom: 0;
  background: var(--panel);
  border-top: 1px solid var(--rule);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 3;
}
.dock .row { display: flex; gap: 12px; align-items: flex-start; }
.dock .glyph { font-size: 11px; letter-spacing: 0.18em; color: var(--cyan); padding-top: 11px; white-space: nowrap; }
.dock textarea {
  flex: 1; min-width: 0;
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 2px; padding: 9px 12px;
  resize: none; min-height: 42px; max-height: 40vh; caret-color: var(--cyan);
  transition: box-shadow 0.2s, border-color 0.2s;
}
.dock textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(8,145,178,0.12), 0 0 18px rgba(8,145,178,0.18); outline: none; }
.dock textarea:disabled { background: #f1f4fa; color: var(--dim); }
.dock .hint { font-size: 11px; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; }
.choice { display: flex; gap: 10px; flex-wrap: wrap; }
.choice button, .power {
  font: inherit; cursor: pointer; min-height: 44px;
  background: var(--panel); color: var(--bot); border: 1px solid var(--bot); border-radius: 2px; padding: 6px 18px;
  letter-spacing: 0.16em; text-transform: uppercase; font-size: 13px;
  box-shadow: inset 0 0 0 0 var(--bot); transition: box-shadow 0.2s, color 0.2s;
}
.choice button:hover, .power:hover { color: #fff; box-shadow: inset 0 -44px 0 0 var(--bot); }
.choice button span { color: var(--dim); letter-spacing: 0.06em; text-transform: none; }
.choice button:hover span { color: #fff; }
.power { align-self: flex-start; font-family: var(--display); font-weight: 700; padding-inline: 26px; }
.note { max-width: 860px; margin: 0 auto; padding: 14px 16px 24px; font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }

@keyframes blink { to { visibility: hidden; } }
@keyframes pulse { 50% { transform: scale(1.5); opacity: 0.55; } }
@keyframes pulse-bar { 50% { opacity: 0.35; } }
@keyframes scan { to { top: 110%; } }
@keyframes fill { 0%, 100% { background: var(--rule); } 50% { background: var(--cyan); } }
@keyframes border-run { to { background-position: 200% 0; } }
@media (max-width: 560px) {
  .line { grid-template-columns: 1fr; gap: 3px; }
  .ticket dl { grid-template-columns: 1fr; }
  .bar { gap: 10px; }
  .bar .clock { display: none; }
  .log { padding-inline: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .cursor, .bar .light.think, .scan, .rail i.live, .ticket::before, .line.think .proc i { animation: none; }
  .scan { display: none; }
  .line.think .proc i { background: var(--cyan); }
}
</style>

</head>
<body>
<div class="term">
  <div class="bar">
    <span class="name">JOBBOT 5000<small>v2034.10</small></span>
    <span class="light" id="light"></span>
    <span id="status">Standby</span>
    <span class="spacer"></span>
    <span class="clock" id="clock"></span>
    <span class="count" id="count"></span>
    <button type="button" id="mute" aria-pressed="false">Sound on</button>
    <button type="button" id="restart" hidden>Restart</button>
  </div>
  <div class="rail" id="rail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="screen">
    <div class="scan" aria-hidden="true"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="dock" id="dock">
      <button type="button" class="power" id="power">Power on</button>
      <div class="row" id="inputRow" hidden>
        <span class="glyph" aria-hidden="true">OPERATOR &gt;</span>
        <textarea id="input" rows="1" aria-label="Your answer" disabled></textarea>
      </div>
      <div class="choice" id="choice" hidden></div>
      <div class="hint" id="hint" hidden>Enter sends &middot; Shift+Enter for a new line</div>
    </div>
  </div>
</div>
<p class="note">Preview. Nothing typed here is saved yet.</p>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const log = $('#log'), input = $('#input'), inputRow = $('#inputRow'), choice = $('#choice'), hint = $('#hint');
  const light = $('#light'), status = $('#status'), count = $('#count'), power = $('#power'), restart = $('#restart'), mute = $('#mute');
  const clock = $('#clock'), rail = [...document.querySelectorAll('#rail i')];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = (ms) => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 150) : ms));

  // The clock runs eight years ahead: it is 2034 in here.
  const tick = () => {
    const d = new Date(); d.setFullYear(d.getFullYear() + 8);
    const p = (n) => String(n).padStart(2, '0');
    clock.innerHTML = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' <b>' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '</b>';
  };
  tick(); setInterval(tick, 1000);

  // Sound. A square wave is the terminal voice; a sine is the thinking hum.
  const audio = { ctx: null, muted: false };
  const tone = (freq, ms, type = 'square', gain = 0.03, delay = 0) => {
    if (audio.muted) return;
    try {
      audio.ctx = audio.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = audio.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + delay;
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
    } catch { /* no audio here */ }
  };
  const beep = () => { tone(1318, 60); tone(1760, 90, 'square', 0.03, 0.07); };     // your turn
  const chirp = () => { tone(1568, 40); tone(2349, 60, 'square', 0.025, 0.05); };   // answer accepted
  const bootTick = () => tone(1975, 25, 'square', 0.018);
  const decodeTick = () => tone(2637, 12, 'square', 0.006);
  const done = () => { tone(784, 70); tone(1046, 70, 'square', 0.03, 0.09); tone(1568, 90, 'square', 0.03, 0.18); tone(2093, 220, 'square', 0.03, 0.27); };
  let hum = null;
  const humOn = () => { if (hum) return; hum = setInterval(() => { tone(196, 50, 'sine', 0.045); tone(294, 40, 'sine', 0.02, 0.16); }, 320); };
  const humOff = () => { clearInterval(hum); hum = null; };
  mute.addEventListener('click', () => {
    audio.muted = !audio.muted;
    mute.textContent = audio.muted ? 'Sound off' : 'Sound on';
    mute.setAttribute('aria-pressed', String(audio.muted));
  });

  // The log. Scrolling happens once per line, instantly, after the line has
  // its full height; scrolling on every character is what made the page shake.
  const scroll = () => requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' }));
  const line = (cls, tag) => {
    const el = document.createElement('div'); el.className = 'line ' + cls;
    const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag;
    const x = document.createElement('span'); x.className = 'txt';
    el.append(t, x); log.append(el); return x;
  };
  // JobBot decodes. The whole line lands at once as scrambled glyphs, so its
  // height never changes, then the letters resolve left to right.
  const GLYPHS = '01<>/\\|=+-*#%$&@?!:;[]{}ABCDEFXYZ';
  const say = (text, speed = 14) => new Promise(resolve => {
    const x = line('bot', 'JobBot');
    const fixed = document.createTextNode(''), raw = document.createElement('span'), cur = document.createElement('span');
    raw.className = 'raw'; cur.className = 'cursor';
    x.append(fixed, raw, cur); scroll();
    if (reduced) { fixed.textContent = text; raw.remove(); cur.remove(); resolve(); return; }
    const scramble = (s) => s.replace(/[^\s]/g, () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)]);
    let n = 0, last = 0, frame = 0;
    raw.textContent = scramble(text);
    const step = (t) => {
      if (t - last >= speed) { n = Math.min(text.length, n + 1 + Math.floor((t - last) / speed / 2)); last = t; if (n % 4 === 0) decodeTick(); }
      fixed.textContent = text.slice(0, n);
      if (frame++ % 2 === 0) raw.textContent = scramble(text.slice(n));
      if (n < text.length) requestAnimationFrame(step); else { raw.remove(); cur.remove(); resolve(); }
    };
    requestAnimationFrame(step);
  });
  const sys = async (text, ok) => {
    const x = line('sys', 'System'); x.textContent = text; scroll();
    if (ok) { await sleep(ok); const s = document.createElement('span'); s.className = 'ok'; s.textContent = 'OK'; x.append(' ', s); bootTick(); }
  };
  const warn = (text) => { const x = line('warn', 'JobBot'); x.textContent = text; tone(330, 120); scroll(); };
  const think = async (text, ms) => {
    setLight('think', 'Processing'); humOn();
    const x = line('think', 'JobBot');
    const label = document.createElement('span'); label.textContent = text;
    const proc = document.createElement('span'); proc.className = 'proc'; proc.innerHTML = '<i></i>'.repeat(10);
    x.append(label, proc); scroll();
    await sleep(ms); x.parentElement.remove(); humOff(); setLight('on', 'Ready');
  };
  const setLight = (cls, text) => { light.className = 'light ' + cls; status.textContent = text; };

  // Asking. Resolves with what they typed. Short answers are sent back.
  const ask = (opts = {}) => new Promise(resolve => {
    beep();
    inputRow.hidden = false; hint.hidden = false; choice.hidden = true;
    input.disabled = false; input.value = ''; input.rows = opts.rows || 1; input.placeholder = opts.placeholder || '';
    input.focus({ preventScroll: true });
    const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + 'px'; };
    grow(); scroll();
    const onKey = (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      e.preventDefault();
      const v = input.value.trim();
      if (!v) { warn('I need an answer before I can go on.'); return; }
      if (opts.min && v.length < opts.min) { warn(opts.short || 'This is not enough information to assign you.'); return; }
      input.removeEventListener('keydown', onKey); input.removeEventListener('input', grow);
      input.disabled = true; input.value = ''; input.style.height = '';
      const x = line('you', 'Operator'); x.textContent = v; chirp(); scroll();
      resolve(v);
    };
    input.addEventListener('keydown', onKey);
    input.addEventListener('input', grow);
  });
  // A choice: buttons, or type the word.
  const choose = (options) => new Promise(resolve => {
    beep();
    choice.innerHTML = ''; choice.hidden = false; inputRow.hidden = true; hint.hidden = true;
    options.forEach(o => {
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = o.key + ' <span>&middot; ' + o.label + '</span>';
      b.addEventListener('click', () => { choice.hidden = true; const x = line('you', 'Operator'); x.textContent = o.key; chirp(); scroll(); resolve(o.key); });
      choice.append(b);
    });
    choice.querySelector('button').focus({ preventScroll: true });
    scroll();
  });

  // The file.
  const S = { name: '', skills: [], jobs: [] };
  const MIN_JOBS = 3, MAX_JOBS = 5;
  const setCount = (i) => {
    count.textContent = i ? 'Job ' + i + ' / ' + MAX_JOBS : '';
    rail.forEach((seg, k) => { seg.className = k < i - 1 ? 'done' : k === i - 1 ? 'live' : ''; });
  };

  async function boot() {
    power.hidden = true; restart.hidden = false;
    setLight('think', 'Booting'); tone(523, 60); tone(784, 60, 'square', 0.03, 0.08); tone(1046, 120, 'square', 0.03, 0.16);
    await sys('JOBBOT 5000  ·  SPORTS LABOR ALLOCATION TERMINAL');
    await sys('Build 2034.10.01  ·  Node SCU-VARI-133  ·  Operator link encrypted');
    await sleep(400);
    await sys('Connecting to the Brady-Manning Work Index .....', 700);
    await sys('Loading the sustainability model .............', 500);
    await sys('Calibrating the allocation engine ............', 450);
    await sys('Opening your file ............................', 400);
    await sleep(300);
    setLight('on', 'Ready');
  }

  // The name lookup. Everything on the record comes from the name, so the
  // same name always gets the same number, the same likes and the same face.
  const hash = (s) => { let h = 5381; for (const ch of s.toLowerCase()) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; return h; };
  const LIKES = ['tomatoes', 'lukewarm coffee', 'airport carpet', 'the smell of new tennis balls', 'parking garages', 'instruction manuals', 'unsalted crackers', 'elevator music', 'left turns', 'plain oatmeal', 'waiting rooms', 'the middle seat', 'dial tones', 'beige', 'loading screens', 'Tuesdays', 'soggy cereal', 'overcast skies', 'fluorescent lighting', 'pennies', 'group projects', 'dry toast', 'long voicemails', 'spreadsheets', 'warm soda', 'the DMV', 'folding fitted sheets', 'mild salsa', 'decaf', 'hold music', 'assembling furniture', 'raw celery', 'slow walkers', 'early mornings', 'paperwork', 'cold pizza', 'radio static', 'stale popcorn', 'gravel', 'traffic cones', 'lint', 'extra napkins', 'printer noises', 'cardboard', 'salad forks', 'mayonnaise packets', 'drizzle', 'concrete', 'tax season', 'the sound of velcro', 'expired coupons', 'moths', 'wet socks', 'chalk dust', 'wobbly tables', 'bread crusts', 'lukewarm baths', 'filler episodes', 'scaffolding', 'pigeons', 'ice chips', 'unread emails', 'mothballs', 'dental floss', 'jury duty', 'dry erase markers', 'canned peas', 'tuna in a pouch', '7 am meetings', 'the sound of a dot matrix printer', 'rain delays', 'the fourth quarter of a blowout'];
  const DISLIKES = ['puppies', 'rainbows', 'kittens', 'sunsets', 'birthday cake', 'hugs', 'long weekends', 'fresh bread', 'free samples', 'snow days', 'naps', 'warm cookies', 'ocean breezes', 'fireworks', 'campfires', 'puppies in sweaters', 'baby goats', 'compliments', 'holidays', 'ice cream', 'the smell of rain', 'pizza parties', 'confetti', 'hammocks', 'chocolate', 'sleeping in', 'music', 'laughter', 'otters holding hands', 'bubble wrap', 'finding money in a pocket', 'tailgates', 'buzzer-beaters', 'walk-off home runs', 'the Olympics', 'mascots', 'halftime shows', 'high fives', 'trophies', 'fresh snow', 'hot chocolate', 'weekends', 'sunshine', 'picnics', 'kittens yawning', 'ducklings', 'pandas', 'dolphins', 'gift cards', 'parades', 'bonfires', 'fuzzy socks', 'breakfast in bed', 'friendly dogs', 'tacos', 'playoff overtime', 'bake sales', 'karaoke', 'beach days', 'fresh towels', 'clean sheets', 'good news', 'surprise parties', 'the first day of summer', 'golden retrievers', 'baby penguins', 'smiles', 'Friday afternoons', 'the opening kickoff', 'a perfectly thrown spiral', 'the seventh-inning stretch', 'the first warm day of spring'];
  const fmt = (n) => n.toLocaleString('en-US');
  const plural = (name) => /[sxz]$/i.test(name) ? name + 'es' : name + 's';
  // Seventeen digits, in groups: 4 8213 9017 7365 2084.
  const indexNo = (h) => {
    let d = '', x = h;
    while (d.length < 17) { x = (x * 1103515245 + 12345) >>> 0; d += String(x).slice(-5); }
    d = d.slice(0, 17);
    return d[0] + ' ' + d.slice(1, 5) + ' ' + d.slice(5, 9) + ' ' + d.slice(9, 13) + ' ' + d.slice(13);
  };
  // Three faces, for when the Index has no photo on file. The class site has
  // every student's photo, so the live version draws the real one.
  const FACES = [
`       _.-----._
     .'  _____  '.
    /  .'     '.  \\
   |  /         \\  |
   | |  (o) (o)  | |
   | |     ^     | |
   | |   \\___/   | |
    \\ \\         / /
     '.'-.___.-'.'
       |  ' '  |
    ___|_______|___
   /               \\`,
`      .-'''''''-.
    .'           '.
   /   .-------.   \\
  |   /         \\   |
  |  |  (o) (o)  |  |
  |  |     ^     |  |
  |  |   \\___/   |  |
  |   \\         /   |
  |    '-.___.-'    |
  |      |   |      |
  |   ___|   |___   |
  '--'           '--'`,
`    ________________
   (________________)
     |  .-------.  |
     '--|       |--'
        | o   o |
        |   ^   |
        |  \\_/  |
         \\     /
          '---'
        .--| |--.
       /   | |   \\
      /____|_|____\\`,
  ];
  // A photo, as text. Dark pixels become dense glyphs, since the screen is
  // white. The middle of the photo is kept, cropped to a portrait.
  const RAMP = '@%#*+=-:. ';
  const toText = (img, cols = 54) => {
    const rows = Math.round(cols * 0.62);
    const c = document.createElement('canvas'); c.width = cols; c.height = rows;
    const ctx = c.getContext('2d');
    const want = cols / (rows * 2), have = img.naturalWidth / img.naturalHeight;
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if (have > want) { sw = sh * want; sx = (img.naturalWidth - sw) / 2; } else { sh = sw / want; sy = (img.naturalHeight - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cols, rows);
    const d = ctx.getImageData(0, 0, cols, rows).data, lum = [];
    for (let i = 0; i < d.length; i += 4) lum.push(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]);
    const sorted = [...lum].sort((a, b) => a - b), lo = sorted[Math.floor(sorted.length * 0.03)], hi = sorted[Math.floor(sorted.length * 0.97)];
    const out = [];
    for (let y = 0; y < rows; y++) {
      let s = '';
      for (let x = 0; x < cols; x++) { const v = Math.min(1, Math.max(0, (lum[y * cols + x] - lo) / Math.max(1, hi - lo))); s += RAMP[Math.round(v * (RAMP.length - 1))]; }
      out.push(s);
    }
    return out.join('\n');
  };
  const photoFromFile = (file) => new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { try { resolve(toText(img)); } catch { resolve(null); } URL.revokeObjectURL(url); };
    img.onerror = () => { resolve(null); URL.revokeObjectURL(url); };
    img.src = url;
  });
  // The dock, asking for a photo: a button that is a file picker, and one that is not.
  const pickPhoto = () => new Promise(resolve => {
    beep();
    choice.innerHTML = ''; choice.hidden = false; inputRow.hidden = true; hint.hidden = true;
    const lab = document.createElement('label'); lab.className = 'file'; lab.innerHTML = 'SCAN <span>&middot; use a photo of me</span>';
    const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; f.id = 'photo';
    f.addEventListener('change', () => { if (!f.files[0]) return; choice.hidden = true; const x = line('you', 'Operator'); x.textContent = 'SCAN'; chirp(); scroll(); resolve(f.files[0]); });
    lab.append(f);
    const b = document.createElement('button'); b.type = 'button'; b.innerHTML = 'SKIP <span>&middot; no photo on file</span>';
    b.addEventListener('click', () => { choice.hidden = true; const x = line('you', 'Operator'); x.textContent = 'SKIP'; chirp(); scroll(); resolve(null); });
    choice.append(lab, b); scroll();
  });
  // A block of text, drawn one line at a time, like a printout.
  const print = async (cls, text) => {
    const x = line('bot', 'JobBot'); const pre = document.createElement('pre'); pre.className = cls; x.append(pre); scroll();
    const rows = text.split('\n');
    for (const r of rows) { pre.textContent += (pre.textContent ? '\n' : '') + r; if (!reduced) { decodeTick(); await sleep(45); } }
  };

  async function lookup() {
    const h = hash(S.name);
    await think('Cross-referencing against all ' + fmt(3 + h % 48000) + ' ' + plural(S.name) + ' in the United States', 2400);
    await say('Found you.');
    await sleep(300);
    const esc = (s) => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const x = line('bot', 'JobBot'); const rec = document.createElement('div'); rec.className = 'record'; x.append(rec); scroll();
    const rows = [['Name', esc(S.name)], ['Trump Index No.', indexNo(h)], ['Education', 'Santa Clara University, graduate'], ['Likes', LIKES[h % LIKES.length]], ['Dislikes', DISLIKES[(h >>> 7) % DISLIKES.length]], ['Status', 'Eligible for allocation']];
    rec.innerHTML = '<h2>Record &middot; Brady-Manning Work Index</h2><dl></dl>';
    const dl = rec.querySelector('dl');
    for (const [k, v] of rows) { dl.insertAdjacentHTML('beforeend', '<dt>' + k + '</dt><dd>' + v + '</dd>'); bootTick(); await sleep(260); }
    await sleep(400);
    await say('Retrieving your image from the Index.');
    const file = await pickPhoto();
    await think('Rendering operator image', 1600);
    const art = (file && await photoFromFile(file)) || FACES[(h >>> 5) % FACES.length];
    await print('portrait', art);
    await sleep(300);
    await say('Operator image rendered. Resemblance: ' + (88 + h % 11) + '%.');
    await sleep(300);
  }

  async function run() {
    await boot();
    await say('Hello. I am JobBot 5000.');
    await sleep(300);
    await say('Tell me who you are and what you can do. I will check the Brady-Manning Work Index for the jobs you want, and then I will assign you one.');
    await sleep(400);
    await say('State your name.');
    S.name = await ask({ placeholder: 'Your name' });
    await lookup();
    await say('Welcome, ' + S.name + '. List your skills. Separate them with commas.');
    S.skills = (await ask({ placeholder: 'writing, video editing, statistics, talking to anyone', rows: 2 })).split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
    await think('Cross-referencing ' + S.skills.length + ' skill' + (S.skills.length === 1 ? '' : 's') + ' against the Brady-Manning Work Index', 1800);
    await say('The Brady-Manning Work Index lists 4,113 open positions that match your skills. Too many. We will narrow it one job at a time.');
    await sleep(300);
    await say('Give me at least ' + MIN_JOBS + ' jobs you would want. You may give me up to ' + MAX_JOBS + '. For each one I need three things: why you want it, what value it produces for the sports world, and why it will still exist in 2034.');

    for (let i = 1; i <= MAX_JOBS; i++) {
      setCount(i);
      await sleep(400);
      await say('JOB ' + i + '. Name one job in the sports world you would want in 2034.');
      const title = await ask({ placeholder: 'Job title' });
      await think('Searching the Brady-Manning Work Index for "' + title + '"', 1600);
      await say('Found. Status: OPEN. Tell me why you want this job.');
      const why = await ask({ rows: 3, min: 60, short: 'This is not enough information to assign you.' });
      await think('Noted', 700);
      await say('What value does this job produce for the sports world? Who is better off because it exists?');
      const value = await ask({ rows: 3, min: 60, short: 'This is not enough information to assign you.' });
      await think('Weighing the value', 1000);
      await say('Last one. Why will this job still exist in 2034? What makes it sustainable?');
      const sustain = await ask({ rows: 3, min: 60, short: 'This is not enough information to assign you.' });
      S.jobs.push({ title, why, value, sustain });
      await think('Filing "' + title + '"', 1400);
      await say('Logged. "' + title + '" is on your file. ' + (i < MIN_JOBS ? (MIN_JOBS - i) + ' more to go.' : ''));
      if (i >= MIN_JOBS && i < MAX_JOBS) {
        await say('Add another job, or request your assignment?');
        const k = await choose([{ key: 'ADD', label: 'one more job' }, { key: 'DONE', label: 'assign me' }]);
        if (k === 'DONE') break;
      }
    }
    setCount(0); rail.forEach(seg => { seg.className = 'done'; });
    await assign();
  }

  async function assign() {
    await say('Running allocation for ' + S.name + '. Stand by.');
    await think('Weighing ' + S.jobs.length + ' jobs against the sustainability model', 2200);
    await think('Consulting the Brady-Manning Work Index', 1400);
    await think('Deciding', 1000);
    // The Index weighs the case you made for a job's future. The longest
    // sustainability answer wins; a tie goes to the job listed first.
    const pick = S.jobs.reduce((best, j) => j.sustain.length > best.sustain.length ? j : best, S.jobs[0]);
    done(); setLight('on', 'Assigned');
    await say('Allocation complete.');
    const t = document.createElement('div'); t.className = 'ticket';
    const esc = (s) => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const id = 'ALLOC-2034-' + Math.random().toString(16).slice(2, 8).toUpperCase();
    const bars = Array.from({ length: 48 }, () => '<i class="' + (Math.random() < 0.3 ? 'g' : Math.random() < 0.3 ? 'w' : '') + '"></i>').join('');
    t.innerHTML = '<h2>Allocation</h2><div class="id">' + id + '</div><div class="big">' + esc(S.name) + ' &rarr; <b>' + esc(pick.title) + '</b></div>'
      + '<dl><dt>Skills</dt><dd>' + esc(S.skills.join(', ')) + '</dd><dt>Jobs on file</dt><dd>' + S.jobs.length + '</dd><dt>Basis</dt><dd>The strongest case for a job that lasts to 2034.</dd></dl>'
      + S.jobs.map(j => '<div class="job"><h3>' + esc(j.title) + (j === pick ? '<span class="pick">assigned</span>' : '') + '</h3><dl><dt>Why</dt><dd>' + esc(j.why) + '</dd><dt>Value</dt><dd>' + esc(j.value) + '</dd><dt>Sustainable</dt><dd>' + esc(j.sustain) + '</dd></dl></div>').join('')
      + '<div class="bars" aria-hidden="true">' + bars + '</div>';
    const wrap = document.createElement('div'); wrap.className = 'line'; wrap.style.display = 'block'; wrap.append(t); log.append(wrap); scroll();
    await sleep(600);
    await say('Your file is complete. Submit it to the instructor?');
    const k = await choose([{ key: 'SUBMIT', label: 'send my file' }, { key: 'HOLD', label: 'keep it open' }]);
    if (k === 'SUBMIT') { done(); await say('Submitted. Your file is with the instructor. You can recall it and change your answers any time before the deadline.'); }
    else await say('Holding. Your answers are saved as you type, so you can come back to this later.');
    inputRow.hidden = true; hint.hidden = true; choice.hidden = true;
    setLight('on', 'Done');
  }

  power.addEventListener('click', run);
  restart.addEventListener('click', () => window.location.reload());
})();
</script>
</body>
